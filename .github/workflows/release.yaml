name: Release
# Publishes to Maven Central through the release parent's 'release' and 'central-portal'
# profiles, once per live release line and all from the SAME commit, so a fix exists on
# every line the moment it is committed. The version is not written into the POM: it is
# '${revision}', supplied per line as '<version>-<line>'. See README.md, section
# "Release lines".
"on":
  workflow_dispatch:
    inputs:
      release_version:
        description: "Version to release, without the line suffix (e.g. 0.9.0)"
        required: true
      train:
        description: "Release train, e.g. 2.0. Empty: this release uploads to Maven Central itself. Set: the bundle of every line is kept for release-train.yaml in maven-release-parent. Release the repositories of a train in the order of their dependencies: each release reads the bundles of the releases before it."
        required: false
        default: ""
concurrency:
  # One release of this repository at a time. Two releases at once would deploy the same
  # coordinates to Maven Central and write the same tag. The lines of one release are a
  # matrix inside the run, held in order by 'max-parallel: 1', so this group is about two
  # runs. GitHub keeps at most one waiting run per group, so a third dispatch while one
  # release runs and one waits ends the waiting one as 'cancelled' without ever starting a
  # job. A release is dispatched by hand, so somebody is there to see that and dispatch
  # again. 'cancel-in-progress: false' protects the run which is already running and
  # nothing else, which is what a release needs: a run cut in half leaves some lines on
  # Central and the rest nowhere.
  #
  # The publish keeps its own group, so a release and a publish run beside each other.
  # They cannot write the same thing. Both upload through the profile 'central-portal',
  # but a release writes fixed versions and the publish of main writes the snapshot.
  group: businesscockpit-camunda8-adapter-release
  cancel-in-progress: false
permissions:
  contents: read
env:
  # release-versions.sh of maven-release-parent at a fixed commit, so a later change of the
  # script cannot break the release of an older commit. A new version of the script comes
  # with a pull request which moves this commit.
  RELEASE_VERSIONS_SH: "https://raw.githubusercontent.com/vanillabp/maven-release-parent/a0a3e691fc99cc80e7a6b87a35b7f7b94a9f6b47/.github/scripts/release-versions.sh"
jobs:
  # No release while a GA line is red. A line which is not GA yet is not asked: it is
  # published as a preview and nothing claims it was proven. The matrix builds it like every
  # other line and hands out the GA lines separately, so which lines this gate waits for is
  # the matrix's own word and not a second list kept here. Every line is a GA line since
  # 8.10 went GA on 2026-09-29, so this gate waits for all three of them today. See
  # decision 14 in the repository's DECISIONS.md.
  #
  # The gate is the nightly matrix itself, called here, and not a look at what the matrix
  # said last night. Reading last night's result would be cheaper, and it would prove less
  # than it looks. This repository compiles against SNAPSHOTs of the VanillaBP Camunda 8
  # adapter and of the cockpit's extensions-commons, and every build resolves them with
  # --update-snapshots at the moment it runs. So a green run of last night says that the
  # code of that commit worked with the artifacts of that night, and the release publishes
  # today's. The commit is the smaller half of the question. Running the matrix inside the
  # release builds the commit which is released against the artifacts it is released
  # against, and it needs no rule about what "the same commit" means after a merge.
  #
  # It costs the release about forty minutes. A release is dispatched by hand and happens a
  # few times a year, so that is cheap, and there is no way past it: a line published with a
  # defect which was already known cannot be taken back off Maven Central.
  #
  # See decision 9 in the repository's DECISIONS.md.
  lines:
    uses: ./.github/workflows/line-matrix.yaml
    secrets: inherit

  # The gate itself. It runs whatever the matrix did, because this job and not the matrix
  # decides which lines a release waits for, and it still has to read which lines were red
  # when the matrix ended red. The answer is the 'broken-ga-lines' output, and an empty one
  # means the matrix never got far enough to say.
  #
  # The matrix is called above without 'preview-line-counts', so the job the night reads
  # asks the GA lines alone here and this gate stays green on a red preview line. The run of
  # the release stays green with it, because the job of a preview line carries
  # 'continue-on-error' in the matrix. There is no preview line today, so this gate reads
  # every line. See decision 14 in the repository's DECISIONS.md.
  ga-lines-verified:
    if: always()
    needs: lines
    runs-on: ubuntu-latest
    steps:
      - name: Every GA line is green
        env:
          BROKEN: "${{ needs.lines.outputs.broken-ga-lines }}"
        run: |
          echo "lines: ${{ needs.lines.result }}"
          case "$BROKEN" in
            none)
              echo "Every GA line built and tested green, so this release may go out." ;;
            "")
              echo "The matrix did not get far enough to say which lines built, so nothing" >&2
              echo "here says this release is safe. Read the jobs of the matrix above." >&2
              exit 1 ;;
            *)
              echo "These GA lines did not build: ${BROKEN}" >&2
              echo "A release publishes to Maven Central and cannot be taken back, so it" >&2
              echo "waits until they are green." >&2
              exit 1 ;;
          esac

  # The live lines are not maintained here: they are the line-* profiles of the POM, which
  # also name the adapter of each line. So the release cannot fall behind the build. The
  # Camunda client of a line comes with that adapter, so a line is published with the client
  # of the adapter version its profile names, and no workflow has to hand a number over. See
  # decision 32 in the repository's DECISIONS.md.
  #
  # Every line is released, a preview line included. Only the gate above leaves such a line
  # out, because nothing has proven it and nothing claims it is proven: its version says
  # alpha.
  discover:
    needs: ga-lines-verified
    runs-on: ubuntu-latest
    outputs:
      lines: "${{ steps.list.outputs.lines }}"
    steps:
      - uses: actions/checkout@v7
      - id: list
        name: Collect the release lines
        run: |
          list=$(sed -n 's|.*<id>line-\([0-9][^<]*\)</id>.*|\1|p' pom.xml \
            | jq -R -s -c 'split("\n")[:-1]')
          echo "lines=${list}" >> "$GITHUB_OUTPUT"
          echo "Releasing lines: ${list}"
      # A version on Maven Central never changes. Below that line nobody can use the version
      # of any line yet, so the job 'tag' may move the tag when a release of the same version
      # runs again.
      - name: Refuse a version which Maven Central has already
        env:
          VERSION: "${{ inputs.release_version }}"
        run: |
          curl -fsSL -o "$RUNNER_TEMP/release-versions.sh" "$RELEASE_VERSIONS_SH"
          lines=$(sed -n 's|.*<id>line-\([0-9][^<]*\)</id>.*|\1|p' pom.xml)
          bash "$RUNNER_TEMP/release-versions.sh" unpublished $(for line in $lines; do echo "$VERSION-$line"; done)

  line:
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # one line at a time: they publish under one release parent and a half-published
      # matrix is harder to read than a stopped one
      max-parallel: 1
      fail-fast: true
      matrix:
        line: "${{ fromJSON(needs.discover.outputs.lines) }}"
    steps:
      - uses: actions/checkout@v7
      # Maven 3.10 writes 'maven-metadata-local.xml' and '_remote.repositories' into the
      # staging directory of central-publishing-maven-plugin, and the Central Portal refuses
      # the bundle: "Bundle has content that does NOT have a .pom file". The runner image
      # ships 3.10 now, so the release brings its own 3.9. Remove this step once a plugin
      # version stages a clean bundle under Maven 3.10.
      - name: Use Maven 3.9
        run: |
          curl -fsSL --retry 5 --retry-all-errors --connect-timeout 20 https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.tar.gz \
            | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-java@v6
        with:
          java-version: 25.0.5+8.0.LTS
          distribution: temurin
          cache: maven
          server-id: vanillabp-central
          server-username-env-var: MAVEN_USERNAME
          server-password-env-var: MAVEN_PASSWORD
          gpg-private-key: "${{ secrets.MAVEN_GPG_PRIVATE_KEY }}"
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE
      # A release train builds the bundle of each release and keeps it as an Actions artifact.
      # release-train.yaml in maven-release-parent uploads the bundles of all repositories of
      # a train as one deployment, because Sonatype allows only a few deployments a month.
      # The bundles of the train which are already there go into the local Maven repository,
      # so this build finds the versions which are not on Maven Central yet. See the README
      # of maven-release-parent.
      - name: Read the bundles of the release train
        if: inputs.train != ''
        env:
          TRAIN: "${{ inputs.train }}"
          LINE: "${{ matrix.line }}"
          # reads the Actions artifacts of the other repositories, which GITHUB_TOKEN cannot
          GH_TOKEN: "${{ secrets.VANILLABP_USER_TOKEN }}"
        run: |
          # the shared part of a release train lives once, in maven-release-parent
          curl -fsSL -o "$RUNNER_TEMP/release-train.sh" \
            https://raw.githubusercontent.com/vanillabp/maven-release-parent/main/.github/scripts/release-train.sh
          bash "$RUNNER_TEMP/release-train.sh" prepare "$TRAIN" "$LINE"
      # main depends on SNAPSHOTs of the platform, the Camunda 8 adapter and the Business
      # Cockpit until those are on Maven Central. Every line gets their released versions
      # here, from the bundles of the train or from Maven Central. If one is in neither place,
      # the release stops before anything leaves this build, and the message names the
      # repository to release first. The line decides the Camunda version only, so every line
      # gets the same versions. The job 'tag' puts them into the commit it tags.
      - name: Use the released versions of VanillaBP
        env:
          TRAIN: "${{ inputs.train }}"
        run: |
          curl -fsSL -o "$RUNNER_TEMP/release-versions.sh" "$RELEASE_VERSIONS_SH"
          bash "$RUNNER_TEMP/release-versions.sh" raise "$TRAIN"
          mkdir -p "$RUNNER_TEMP/release-versions"
          git diff > "$RUNNER_TEMP/release-versions/raised.patch"
          cp "$RUNNER_TEMP/raised-versions.txt" "$RUNNER_TEMP/release-versions/" 2>/dev/null || true
      - name: Keep the released versions for the tag
        uses: actions/upload-artifact@v7
        with:
          # the same for every line, so the line which comes last may replace it
          name: release-versions
          path: "${{ runner.temp }}/release-versions/"
          retention-days: 7
          overwrite: true
      # 'clean', because classes compiled against one Camunda client are binary compatible
      # with no other one, so a stale target/ from the previous line fails at runtime
      # rather than at compile time
      - name: "Release line ${{ matrix.line }}"
        # No release has run yet, so this number is read off the publish workflow: that
        # step does the same build and upload and takes 6.9 minutes at its worst. This one
        # also signs and hands the artifacts to Maven Central, which is why it gets twice
        # what the publish gets. The lines release one at a time, so a line which hangs
        # holds every line after it.
        timeout-minutes: 60
        run: mvn -s $GITHUB_WORKSPACE/.github/workflows/github-packages-settings.xml
          --batch-mode --no-transfer-progress
          -Pline-${{ matrix.line }},release,central-portal
          -Drevision=${{ github.event.inputs.release_version }}-${{ matrix.line }}
          $TRAIN_ARGS clean deploy
        env:
          # builds the bundle and does not upload it. '-DskipUpload' is for a POM which
          # configures the plugin without the property of release-parent
          TRAIN_ARGS: "${{ inputs.train != '' && '-Dcentral.skip.upload=true -DskipUpload=true' || '' }}"
          # maven-gpg-plugin 3.2 reads the passphrase from this variable. Passing it as
          # -Dgpg.passphrase is deprecated since 3.2
          MAVEN_GPG_PASSPHRASE: "${{ secrets.MAVEN_GPG_PASSPHRASE }}"
          MAVEN_USERNAME: "${{ secrets.MAVEN_CENTRAL_PORTAL_TOKEN_USER }}"
          MAVEN_PASSWORD: "${{ secrets.MAVEN_CENTRAL_PORTAL_TOKEN_PW }}"
          USER_NAME: "${{ secrets.VANILLABP_USER_NAME }}"
          USER_TOKEN: "${{ secrets.VANILLABP_USER_TOKEN }}"
      - name: Pack the bundle for the release train
        if: inputs.train != ''
        env:
          TRAIN: "${{ inputs.train }}"
          LINE: "${{ matrix.line }}"
          VERSION: "${{ inputs.release_version }}-${{ matrix.line }}"
        run: bash "$RUNNER_TEMP/release-train.sh" pack "$TRAIN" "$LINE" "$VERSION"
      - name: Keep the bundle for the release train
        if: inputs.train != ''
        uses: actions/upload-artifact@v7
        with:
          # one name per repository and line: a new build of the same line replaces the old
          # one, and release-train.yaml takes the newest
          name: "release-train-${{ inputs.train }}-${{ github.event.repository.name }}-${{ matrix.line }}"
          path: "${{ runner.temp }}/release-train/"
          retention-days: 30
          if-no-files-found: error
          overwrite: true

  tag:
    needs: line
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: The released versions the lines were built with
        uses: actions/download-artifact@v8
        with:
          name: release-versions
          path: "${{ runner.temp }}/release-versions"
      - name: Tag the commit every line was built from
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          # The lines were built with the released versions of VanillaBP, so the tag points at
          # a commit which has them. That commit is on no branch, and main keeps its SNAPSHOTs.
          if [ -s "$RUNNER_TEMP/release-versions/raised.patch" ]; then
            git apply "$RUNNER_TEMP/release-versions/raised.patch"
            { echo "Prepare release v$VERSION"; echo; cat "$RUNNER_TEMP/release-versions/raised-versions.txt"; } \
              | git commit -a -F -
          fi
          if git rev-parse -q --verify "refs/tags/$VERSION" > /dev/null; then
            # Maven Central has no line of this version, checked before the build, so a
            # release of the same version which runs again may move the tag
            echo "::warning::Tag $VERSION exists already. This release moves it to this build."
            git tag -f -a "$VERSION" -m "Release $VERSION, all lines"
            git push --force origin "refs/tags/$VERSION"
          else
            git tag -a "${{ github.event.inputs.release_version }}" \
              -m "Release ${{ github.event.inputs.release_version }}, all lines"
            git push origin "${{ github.event.inputs.release_version }}"
          fi
        env:
          TRAIN: "${{ inputs.train }}"
          VERSION: "${{ github.event.inputs.release_version }}"
      - name: Create the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "${{ github.event.inputs.release_version }}"
          name: "v${{ github.event.inputs.release_version }}"
          generate_release_notes: true
          draft: true
